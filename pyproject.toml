[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-medical-image-rdhei"
version = "0.1.0"
description = "Secure metadata embedding for reversible data hiding in encrypted medical images"
requires-python = ">=3.9"
dependencies = [
    "cryptography",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
